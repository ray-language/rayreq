<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RayReq</title>
<!-- @raylang/elements, served by the program where npm would put it (elements/bridge). -->
<link rel="stylesheet" href="/node_modules/@raylang/elements/tokens.css">
<link rel="stylesheet" href="/node_modules/@raylang/elements/base.css">
<link rel="stylesheet" href="app.css">
<style>:not(:defined) { visibility: hidden; }</style>
</head>
<body>
<ray-app-shell id="shell" layout="alt" padding="0">
  <ray-sidebar slot="navbar" id="sidebar" width="17rem" data-i18n-attr="label:sidebar.label">
    <div slot="header" class="side-head">
      <ray-group gap="xs" class="project-row">
        <ray-select id="project" size="xs" class="grow" data-i18n-attr="placeholder:project.choose,aria-label:project.label"></ray-select>
        <ray-menu id="project-menu" placement="bottom-end">
          <ray-icon-button slot="trigger" size="sm" variant="subtle" label="Project actions" data-i18n-attr="label:project.actions"><ray-icon name="more-horizontal"></ray-icon></ray-icon-button>
          <ray-menu-item value="new"><ray-icon slot="left" name="plus"></ray-icon><span data-i18n="project.new"></span></ray-menu-item>
          <ray-menu-item value="edit" data-needs-project><span data-i18n="project.edit"></span></ray-menu-item>
          <ray-menu-divider></ray-menu-divider>
          <ray-menu-item value="delete" color="red" data-needs-project><span data-i18n="project.delete"></span></ray-menu-item>
        </ray-menu>
      </ray-group>
      <ray-search id="filter" size="xs" debounce="80" data-i18n-attr="placeholder:tree.filter,aria-label:tree.filter"></ray-search>
    </div>
    <ray-menu id="tree-menu" native context>
      <div slot="trigger" id="tree" class="tree" role="tree" data-i18n-attr="aria-label:tree.label"></div>
    </ray-menu>
    <div slot="footer" class="side-foot">
      <ray-button id="new-request" size="xs" variant="light" class="grow"><ray-icon slot="left" name="plus"></ray-icon><span data-i18n="request.new"></span></ray-button>
      <ray-tooltip data-i18n-attr="label:folder.new">
        <ray-icon-button id="new-folder" size="md" variant="default" label="New folder" data-i18n-attr="label:folder.new"><ray-icon name="folder"></ray-icon></ray-icon-button>
      </ray-tooltip>
    </div>
  </ray-sidebar>

  <header slot="header" class="topbar">
    <ray-icon-button id="toggle-sidebar" variant="subtle" size="sm" label="Toggle sidebar" data-i18n-attr="label:view.toggleSidebar"><ray-icon name="panel-left"></ray-icon></ray-icon-button>
    <div id="tabs" class="tabstrip" role="tablist" data-i18n-attr="aria-label:tabs.label"></div>
    <ray-group gap="xs" class="top-actions">
      <ray-group gap="0" class="env-picker">
        <ray-select id="environment" size="xs" variant="filled" data-i18n-attr="aria-label:env.label,placeholder:env.label"></ray-select>
        <ray-menu id="env-tools" placement="bottom-end">
          <ray-icon-button slot="trigger" id="manage-envs" size="sm" variant="subtle" label="Environments and cookies" data-i18n-attr="label:env.tools"><ray-icon name="settings"></ray-icon></ray-icon-button>
          <ray-menu-item value="environments"><span data-i18n="env.manage"></span></ray-menu-item>
          <ray-menu-item value="cookies"><span data-i18n="cookies.manage"></span></ray-menu-item>
        </ray-menu>
      </ray-group>
      <ray-select id="language" size="xs" variant="filled" data-i18n-attr="aria-label:settings.language">
        <option value="en">English</option>
        <option value="es">Español</option>
      </ray-select>
      <ray-theme-toggle size="sm"></ray-theme-toggle>
    </ray-group>
  </header>

  <main id="main">
    <ray-center id="welcome" class="fill">
      <ray-empty-state id="empty">
        <ray-icon slot="icon" name="terminal"></ray-icon>
        <span id="empty-text"></span>
        <ray-button slot="actions" id="empty-action" size="sm"></ray-button>
      </ray-empty-state>
    </ray-center>

    <section id="workspace" class="workspace" hidden>
      <form id="urlbar" class="urlbar" autocomplete="off">
        <ray-select id="method" size="sm" class="method" data-i18n-attr="aria-label:request.method"></ray-select>
        <ray-input id="url" size="sm" class="grow mono" placeholder="https://api.example.com/users" data-i18n-attr="aria-label:request.url" spellcheck="false" autocapitalize="off"></ray-input>
        <ray-button id="send" type="submit" size="sm" class="send"><span data-i18n="request.send"></span></ray-button>
        <ray-button id="save" type="button" size="sm" variant="default"><span data-i18n="request.save"></span></ray-button>
        <ray-tooltip data-i18n-attr="label:curl.copy">
          <ray-icon-button id="copy-curl" size="md" variant="subtle" label="Copy as cURL" data-i18n-attr="label:curl.copy"><ray-icon name="terminal"></ray-icon></ray-icon-button>
        </ray-tooltip>
      </form>
      <p id="url-preview" class="url-preview" hidden><span class="label" data-i18n="vars.resolvedUrl"></span> <span id="url-resolved" class="mono"></span></p>

      <ray-split id="panes" class="panes" position="50%" min="320" autosave="rayreq.panes" data-i18n-attr="aria-label:panes.resize">
        <section slot="start" class="pane request-pane" data-i18n-attr="aria-label:request.label">
          <ray-tabs id="req-tabs" value="params" class="pane-tabs">
            <ray-tab value="params"><span data-i18n="request.params"></span><ray-badge slot="right" size="xs" color="gray" id="count-params" hidden></ray-badge></ray-tab>
            <ray-tab value="headers"><span data-i18n="request.headers"></span><ray-badge slot="right" size="xs" color="gray" id="count-headers" hidden></ray-badge></ray-tab>
            <ray-tab value="auth"><span data-i18n="request.auth"></span><ray-badge slot="right" size="xs" variant="dot" color="green" id="has-auth" hidden></ray-badge></ray-tab>
            <ray-tab value="body"><span data-i18n="request.body"></span><ray-badge slot="right" size="xs" variant="dot" id="has-body" hidden></ray-badge></ray-tab>
            <ray-tab value="captures"><span data-i18n="request.captures"></span><ray-badge slot="right" size="xs" color="gray" id="count-captures" hidden></ray-badge></ray-tab>
            <ray-tab value="variables"><span data-i18n="request.variables"></span><ray-badge slot="right" size="xs" color="orange" id="count-missing" hidden></ray-badge></ray-tab>
            <ray-tab value="settings"><span data-i18n="request.settings"></span></ray-tab>
            <ray-tab-panel value="params"><div id="params" class="kv"></div></ray-tab-panel>
            <ray-tab-panel value="headers"><div id="headers" class="kv"></div></ray-tab-panel>
            <ray-tab-panel value="auth"><div id="auth-editor" class="auth-pane"></div></ray-tab-panel>
            <ray-tab-panel value="body">
              <ray-stack gap="sm" class="body-editor">
                <ray-group gap="sm" justify="space-between">
                  <ray-segmented-control id="body-type" size="xs"></ray-segmented-control>
                  <ray-button id="format-body" size="xs" variant="subtle" hidden><span data-i18n="body.format"></span></ray-button>
                </ray-group>
                <ray-textarea id="body" class="mono code-area" rows="14" spellcheck="false" autocapitalize="off" data-i18n-attr="aria-label:request.body"></ray-textarea>
                <div id="form" class="kv" hidden></div>
                <p id="body-none" class="ray-muted" data-i18n="body.none" hidden></p>
                <p id="body-error" class="field-error" role="alert" hidden></p>
              </ray-stack>
            </ray-tab-panel>
            <ray-tab-panel value="captures">
              <p class="note" data-i18n="captures.help"></p>
              <div id="captures" class="kv"></div>
            </ray-tab-panel>
            <ray-tab-panel value="variables">
              <ray-alert id="vars-missing" color="orange" variant="light" hidden></ray-alert>
              <div id="vars-list"></div>
              <p class="note" data-i18n="vars.syntax"></p>
            </ray-tab-panel>
            <ray-tab-panel value="settings">
              <ray-stack gap="md" class="settings">
                <ray-number-input id="timeout" min="0" max="10800" step="5" size="sm" data-i18n-attr="label:settings.timeout,description:settings.timeoutHelp" suffix=" s"></ray-number-input>
                <ray-switch id="follow" data-i18n-attr="label:settings.follow"></ray-switch>
                <ray-number-input id="max-redirects" min="0" max="50" size="sm" data-i18n-attr="label:settings.maxRedirects"></ray-number-input>
                <ray-switch id="use-cookies" data-i18n-attr="label:settings.cookies,description:settings.cookiesHelp"></ray-switch>
              </ray-stack>
            </ray-tab-panel>
          </ray-tabs>
        </section>

        <section slot="end" class="pane response-pane" aria-live="polite" data-i18n-attr="aria-label:response.label">
          <div id="response-empty" class="fill center">
            <ray-empty-state compact>
              <ray-icon slot="icon" name="arrow-up-right"></ray-icon>
              <span id="response-empty-text"></span>
            </ray-empty-state>
          </div>
          <div id="response-busy" class="fill center" hidden>
            <ray-stack gap="sm" align="center">
              <ray-spinner size="md"></ray-spinner>
              <span class="ray-muted" id="busy-text"></span>
              <ray-button id="cancel" size="xs" variant="default"><span data-i18n="request.cancel"></span></ray-button>
            </ray-stack>
          </div>
          <div id="response" class="response" hidden>
            <div class="response-head">
              <ray-badge id="status" size="md" radius="sm" normal-case></ray-badge>
              <span id="duration" class="metric"></span>
              <span id="size" class="metric"></span>
              <span class="grow"></span>
              <ray-tooltip data-i18n-attr="label:response.copy">
                <ray-icon-button id="copy-body" size="sm" variant="subtle" label="Copy body" data-i18n-attr="label:response.copy"><ray-icon name="copy"></ray-icon></ray-icon-button>
              </ray-tooltip>
              <ray-tooltip data-i18n-attr="label:response.saveBody">
                <ray-icon-button id="save-body" size="sm" variant="subtle" label="Save body to a file" data-i18n-attr="label:response.saveBody"><ray-icon name="download"></ray-icon></ray-icon-button>
              </ray-tooltip>
            </div>
            <ray-alert id="response-error" color="red" variant="light" hidden></ray-alert>
            <ray-alert id="response-unresolved" color="orange" variant="light" hidden></ray-alert>
            <ray-alert id="response-cookies" color="orange" variant="light" hidden></ray-alert>
            <ray-tabs id="res-tabs" value="body" class="pane-tabs">
              <ray-tab value="body"><span data-i18n="response.body"></span></ray-tab>
              <ray-tab value="headers"><span data-i18n="response.headers"></span><ray-badge slot="right" size="xs" color="gray" id="count-res-headers"></ray-badge></ray-tab>
              <ray-tab value="request"><span data-i18n="response.request"></span></ray-tab>
              <ray-tab value="captures" id="res-captures-tab" hidden><span data-i18n="response.captures"></span><ray-badge slot="right" size="xs" color="gray" id="count-res-captures"></ray-badge></ray-tab>
              <ray-tab value="history"><span data-i18n="response.history"></span></ray-tab>
              <ray-tab-panel value="auth"><div id="auth-editor" class="auth-pane"></div></ray-tab-panel>
            <ray-tab-panel value="body">
                <ray-group gap="xs" class="body-tools" id="body-tools">
                  <ray-segmented-control id="body-view" size="xs"></ray-segmented-control>
                  <ray-switch id="wrap" size="xs" data-i18n-attr="label:response.wrap"></ray-switch>
                </ray-group>
                <div id="body-view-area" class="body-area"></div>
              </ray-tab-panel>
              <ray-tab-panel value="headers"><div id="res-headers"></div></ray-tab-panel>
              <ray-tab-panel value="request"><div id="raw-request"></div></ray-tab-panel>
              <ray-tab-panel value="captures"><div id="res-captures"></div></ray-tab-panel>
              <ray-tab-panel value="history"><div id="history"></div></ray-tab-panel>
            </ray-tabs>
          </div>
        </section>
      </ray-split>
    </section>
  </main>

  <ray-statusbar slot="footer">
    <ray-statusbar-item id="status-project"><ray-icon slot="icon" name="folder"></ray-icon><span></span></ray-statusbar-item>
    <ray-statusbar-item id="status-env"><ray-icon slot="icon" name="monitor"></ray-icon><span></span></ray-statusbar-item>
    <ray-statusbar-item slot="right" id="status-hint"></ray-statusbar-item>
    <ray-statusbar-item slot="right" id="status-version"></ray-statusbar-item>
  </ray-statusbar>
</ray-app-shell>

<!-- Dialogs -->
<ray-dialog id="name-dialog" size="sm">
  <form id="name-form" method="dialog">
    <ray-stack gap="md">
      <ray-input id="name-input" name="name" required data-i18n-attr="label:dialog.name"></ray-input>
      <ray-textarea id="desc-input" name="description" rows="2" data-i18n-attr="label:dialog.description"></ray-textarea>
    </ray-stack>
  </form>
  <ray-button slot="footer" variant="default" data-dialog-close><span data-i18n="dialog.cancel"></span></ray-button>
  <ray-button slot="footer" id="name-ok"></ray-button>
</ray-dialog>

<ray-dialog id="move-dialog" size="sm">
  <ray-select id="move-target" data-i18n-attr="label:dialog.moveTo"></ray-select>
  <ray-button slot="footer" variant="default" data-dialog-close><span data-i18n="dialog.cancel"></span></ray-button>
  <ray-button slot="footer" id="move-ok"><span data-i18n="dialog.move"></span></ray-button>
</ray-dialog>

<ray-dialog id="env-dialog" size="lg" data-i18n-attr="label:env.dialogTitle">
  <ray-stack gap="md">
    <ray-group gap="xs" class="env-head">
      <ray-select id="env-edit" size="sm" class="grow" data-i18n-attr="label:env.editing"></ray-select>
      <ray-menu id="env-menu" placement="bottom-end">
        <ray-icon-button slot="trigger" size="md" variant="default" label="Environment actions" data-i18n-attr="label:env.actions"><ray-icon name="more-horizontal"></ray-icon></ray-icon-button>
        <ray-menu-item value="activate"><span data-i18n="env.activate"></span></ray-menu-item>
        <ray-menu-divider></ray-menu-divider>
        <ray-menu-item value="new"><ray-icon slot="left" name="plus"></ray-icon><span data-i18n="env.new"></span></ray-menu-item>
        <ray-menu-item value="duplicate"><span data-i18n="env.duplicate"></span></ray-menu-item>
        <ray-menu-item value="rename"><span data-i18n="env.rename"></span></ray-menu-item>
        <ray-menu-divider></ray-menu-divider>
        <ray-menu-item value="delete" color="red"><span data-i18n="env.delete"></span></ray-menu-item>
      </ray-menu>
    </ray-group>
    <form id="env-name-row" class="inline-name" hidden>
      <ray-input id="env-name" size="sm" class="grow" data-i18n-attr="aria-label:dialog.name,placeholder:dialog.name"></ray-input>
      <ray-button id="env-name-ok" type="submit" size="sm"></ray-button>
      <ray-button id="env-name-cancel" type="button" size="sm" variant="default"><span data-i18n="dialog.cancel"></span></ray-button>
    </form>
    <p class="note" data-i18n="env.help"></p>
    <div id="env-vars" class="kv"></div>
    <ray-switch id="block-unresolved" size="sm" data-i18n-attr="label:env.blockUnresolved"></ray-switch>
  </ray-stack>
  <ray-button slot="footer" variant="default" data-dialog-close><span data-i18n="dialog.cancel"></span></ray-button>
  <ray-button slot="footer" id="env-save"><span data-i18n="dialog.save"></span></ray-button>
</ray-dialog>

<ray-dialog id="folder-vars-dialog" size="lg">
  <ray-stack gap="md">
    <ray-select id="folder-vars-scope" size="sm" data-i18n-attr="label:folder.varsScope"></ray-select>
    <p class="note" id="folder-vars-help"></p>
    <div id="folder-vars" class="kv"></div>
  </ray-stack>
  <ray-button slot="footer" variant="default" data-dialog-close><span data-i18n="dialog.cancel"></span></ray-button>
  <ray-button slot="footer" id="folder-vars-save"><span data-i18n="dialog.save"></span></ray-button>
</ray-dialog>

<ray-dialog id="folder-auth-dialog" size="md">
  <p class="note" data-i18n="auth.folderHelp"></p>
  <div id="folder-auth"></div>
  <ray-button slot="footer" variant="default" data-dialog-close><span data-i18n="dialog.cancel"></span></ray-button>
  <ray-button slot="footer" id="folder-auth-save"><span data-i18n="dialog.save"></span></ray-button>
</ray-dialog>

<ray-dialog id="cookies-dialog" size="xl">
  <p class="note" id="cookies-note"></p>
  <div id="cookies-list"></div>
  <ray-button slot="footer" id="cookies-clear" variant="subtle" color="red"><span data-i18n="cookies.clear"></span></ray-button>
  <ray-button slot="footer" data-dialog-close><span data-i18n="dialog.close"></span></ray-button>
</ray-dialog>

<ray-dialog id="curl-dialog" size="lg" data-i18n-attr="label:curl.importTitle">
  <ray-stack gap="sm">
    <p class="note" data-i18n="curl.importHelp"></p>
    <ray-textarea id="curl-text" class="mono code-area" rows="12" spellcheck="false" autocapitalize="off" data-i18n-attr="aria-label:curl.importTitle" placeholder="curl 'https://api.example.com/users' -H 'Accept: application/json'"></ray-textarea>
    <p id="curl-error" class="field-error" role="alert" hidden></p>
  </ray-stack>
  <ray-button slot="footer" variant="default" data-dialog-close><span data-i18n="dialog.cancel"></span></ray-button>
  <ray-button slot="footer" id="curl-ok"><span data-i18n="curl.import"></span></ray-button>
</ray-dialog>

<ray-dialog id="openapi-dialog" size="lg" data-i18n-attr="label:openapi.title">
  <ray-stack gap="sm">
    <p class="note" data-i18n="openapi.help"></p>
    <ray-group gap="sm" align="center">
      <ray-button id="openapi-file" variant="default" size="sm"><ray-icon slot="left" name="file"></ray-icon><span data-i18n="openapi.chooseFile"></span></ray-button>
      <span id="openapi-file-name" class="note"></span>
    </ray-group>
    <ray-textarea id="openapi-text" class="mono code-area" rows="12" spellcheck="false" autocapitalize="off" data-i18n-attr="aria-label:openapi.title,placeholder:openapi.placeholder"></ray-textarea>
    <p id="openapi-error" class="field-error" role="alert" hidden></p>
  </ray-stack>
  <ray-button slot="footer" variant="default" data-dialog-close><span data-i18n="dialog.cancel"></span></ray-button>
  <ray-button slot="footer" id="openapi-ok"><span data-i18n="openapi.import"></span></ray-button>
</ray-dialog>

<ray-dialog id="runner-dialog" size="xl">
  <ray-stack gap="sm">
    <p class="note" id="runner-note"></p>
    <ray-group gap="lg" align="end">
      <ray-switch id="runner-stop-on-failure" data-i18n-attr="label:runner.stopOnFailure"></ray-switch>
      <ray-number-input id="runner-delay" min="0" max="60000" step="100" value="0" size="sm" suffix=" ms" data-i18n-attr="label:runner.delay"></ray-number-input>
    </ray-group>
    <ray-progress id="runner-progress" value="0" size="sm" data-i18n-attr="label:runner.progress"></ray-progress>
    <p id="runner-summary" class="runner-summary" role="status"></p>
    <div id="runner-list"></div>
  </ray-stack>
  <ray-button slot="footer" variant="default" data-dialog-close><span data-i18n="dialog.close"></span></ray-button>
  <ray-button slot="footer" id="runner-run"><span data-i18n="runner.run"></span></ray-button>
</ray-dialog>

<ray-command-palette id="palette" native-menus hotkey=""></ray-command-palette>
<ray-toaster position="bottom-end"></ray-toaster>

<script type="module" src="js/main.js"></script>
</body>
</html>
