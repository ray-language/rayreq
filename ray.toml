[package]
name = "rayreq"
version = "0.1.6"
license = "Apache-2.0"
raylang = "1.27.90"

# The page (www/) is plain HTML + ES modules on ray-elements, served by the process over ray://app.
[native]
embed = ["www"]

[app]
public_key = "387c0da574710c40a7a3715fd7245980c695550249985529a7e08e4c12e80718"
name = "RayReq"
id = "org.raylang.rayreq"
copyright = "© 2026 Rayala"
# ray bundle renders the app icon from this PNG; brand/icon.svg is its source (make icon).
icon = "brand/icon.png"
# ray bundle signs with this Developer ID (hardened runtime + timestamp) and notarizes through
# this notarytool keychain profile (xcrun notarytool store-credentials rayala …).
sign = "Developer ID Application: ROBERTO CARLOS AYALA MENESES (A2CY27N22G)"
notary = "rayala"

[dependencies]
elements = "^0.11.0"
net = "^0.14.0"
db = "^0.7.2"
yaml = "^0.1.1"
