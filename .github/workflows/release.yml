# Linux and Windows release artifacts (the macOS one is made on a Mac, where it is signed and
# notarized). Each runner builds the native bundle for its platform with `ray release --no-sign`
# and uploads its dist/ (the zip and an unsigned update.json); the artifacts are then merged into
# the Mac's dist/ and sealed there with the app's private key (`ray release seal dist`), which
# the runners never see.
name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install the webview's libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install raylang (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL https://raylang.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install raylang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raylang.dev/install.ps1 | iex
          $ray = Get-ChildItem -Path $env:USERPROFILE, $env:LOCALAPPDATA -Recurse -Filter ray.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ray) { throw "ray.exe not found after install" }
          Add-Content -Path $env:GITHUB_PATH -Value $ray.DirectoryName

      - run: ray --version

      - name: Tests
        run: ray test

      # ray release on Windows runs signtool with the macOS [app] sign identity, and --no-sign
      # does not turn it off (findings #309): build from a ray.toml without those lines.
      - name: Drop the macOS signing identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-Content ray.toml) | Where-Object { $_ -notmatch '^(sign|notary) = ' } | Set-Content ray.toml

      - name: Release build (unsigned)
        run: ray release --no-sign -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
